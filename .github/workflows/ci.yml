name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  MPLBACKEND: Agg
  PYTHONPATH: ${{ github.workspace }}/src
  MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib

jobs:
  pipeline:
    name: 管道复现（Python ${{ matrix.python-version }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装中文字体（图表需要）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: 端到端运行完整管道
        run: make pipeline

      - name: 运行测试
        run: make test

      - name: 产物体检
        run: make verify

      - name: 执行全部 SQL 查询（验证 SQL 层可用）
        run: |
          # 优先用仓库自带的验证器：逐条执行并产出可提交的验证日志
          python scripts/verify_sql.py
          # 同时冒烟测试 CLI 的 sql 子命令，确认两种路径写法都能解析
          python -m qingfeng.cli sql --file 03_kpi_queries.sql > /tmp/kpi_sql.log
          python -m qingfeng.cli sql --file sql/04_analysis_queries.sql > /tmp/analysis_sql.log
          echo "SQL 层执行通过（$(grep -c '\[PASS\]' reports/sql_verification.log) 条语句）"

      - name: 确认关键产物已生成
        run: |
          set -e
          test -f reports/数据分析报告.md
          test -f reports/dashboard.html
          test -f reports/kpi_catalog.csv
          test -f data/processed/qingfeng.sqlite
          test -f data/processed/validation_report.csv
          test -f data/processed/anomaly_evaluation.csv
          FIGURES=$(ls reports/figures/*.png | wc -l)
          echo "已生成图表 $FIGURES 张"
          test "$FIGURES" -ge 10

      - name: 校验可复现性（同种子应产生一致的关键指标）
        run: |
          python - <<'PY'
          import hashlib, pathlib, sys
          cfg = pathlib.Path("data/processed/kpi_summary.csv")
          digest = hashlib.sha256(cfg.read_bytes()).hexdigest()[:16]
          print(f"kpi_summary.csv sha256_16 = {digest}")
          pathlib.Path("reports/kpi_digest.txt").write_text(digest, encoding="utf-8")
          PY

      - name: 上传分析报告与图表
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-artifacts-py${{ matrix.python-version }}
          path: |
            reports/
            data/processed/*.csv
          retention-days: 14
          if-no-files-found: warn
